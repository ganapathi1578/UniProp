[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "agqa-dataset"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pyarrow>=14.0",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    "zstandard>=0.22",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "polars>=0.20", "duckdb>=0.9"]
