dataset: "agqa_balanced"
split: "train"

source:
  qa_path: "data/dataset/agqa_balanced/train_balanced.txt"
  scenegraph_path: "data/dataset/agqa_scene_graphs/AGQA_train_stsgs.pkl"

selection:
  mode: "all"
  max_records: 1000

generation:
  max_k: 40
  seed: 42

output:
  root_dir: "data/generated"
  scale: "1m"
  shard_size: 500000
